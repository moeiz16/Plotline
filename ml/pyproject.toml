[project]
name = "plotline-ml"
version = "0.1.0"
description = "Plotline land-change encoder: a tiny self-supervised Sentinel-2 encoder trained with LeJEPA (SIGReg)"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0",
  "torch>=2.5",
  "scikit-learn>=1.5",
  # LeJEPA reference implementation (SIGReg). Not on PyPI; pinned to a commit.
  "lejepa @ git+https://github.com/galilai-group/lejepa.git@c293d291ca87cd4fddee9d3fffe4e914c7272052",
  # Earth observation reads (anonymous, no account)
  "rasterio>=1.4",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["plotline_ml*"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]
