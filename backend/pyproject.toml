[project]
name = "plotline"
version = "0.1.0"
description = "Plotline: EU Deforestation Regulation (EUDR) due-diligence platform"
readme = "../README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  # web
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.12",
  "orjson>=3.10",
  # config / models
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "email-validator>=2.2",
  # db
  "sqlalchemy[asyncio]>=2.0.36",
  "aiosqlite>=0.20",
  "asyncpg>=0.30",
  "alembic>=1.14",
  # security
  "argon2-cffi>=23.1",
  "pyjwt>=2.10",
  # spatial
  "duckdb>=1.1",
  "shapely>=2.0",
  "pyproj>=3.7",
  "h3>=4.1",
  "numpy>=2.0",
  "pillow>=11.0",
  # workflows
  "temporalio>=1.9",
  # documents
  "fpdf2>=2.8",
  # infra
  "httpx>=0.27",
  "structlog>=24.4",
  "prometheus-client>=0.21",
  "typer>=0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=6.0",
  "ruff>=0.8",
  "mypy>=1.13",
]
# Live Earth-observation reads (Microsoft Planetary Computer, Hansen GFC, JRC GFC2020). Optional:
# the app runs fully offline on the bundled synthetic landscape without these.
eo = [
  "rasterio>=1.4",
  "pystac-client>=0.8",
  "planetary-computer>=1.0",
]
# Cloud text generation for plain-language summaries (free tiers via LiteLLM). Optional: LLM_FAKE=true
# uses deterministic offline summaries.
ai = ["litellm>=1.55"]

[project.scripts]
plotline = "app.cli:app"

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["spatial/data/*.geojson", "rules/data/*.json", "eo/data/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC", "RUF"]
ignore = ["S101", "B008", "RUF012", "RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]
"tests/**/*.py" = ["S105", "S106", "S311"]

[tool.mypy]
python_version = "3.13"
strict = false
ignore_missing_imports = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/"]
